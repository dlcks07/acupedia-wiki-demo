<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Acupedia Wiki Editor Demo</title>

    <!-- TinyMCE -->
    <script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f7fa;
        color: #252a31;
        font-family:
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Noto Sans KR',
          Arial,
          sans-serif;
      }

      /* 상단 헤더 */
      .top-header {
        background: white;
        border-bottom: 1px solid #e5e8ec;
      }

      .top-header-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 22px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-logo {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: #276749;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 22px;
        font-weight: 700;
      }

      .brand-title {
        font-size: 21px;
        font-weight: 700;
        color: #1e2933;
      }

      .brand-subtitle {
        margin-top: 2px;
        font-size: 13px;
        color: #7b8490;
      }

      .demo-badge {
        padding: 7px 12px;
        background: #edf7f2;
        color: #276749;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 600;
      }

      /* 전체 컨테이너 */
      .container {
        max-width: 1280px;
        margin: 30px auto 70px;
        padding: 0 24px;
      }

      .page-heading {
        margin-bottom: 22px;
      }

      .page-heading h1 {
        margin: 0 0 8px;
        font-size: 27px;
        letter-spacing: -0.5px;
      }

      .page-heading p {
        margin: 0;
        color: #68727e;
        line-height: 1.7;
        font-size: 14px;
      }

      /* 설정 패널 */
      .control-panel {
        background: white;
        border: 1px solid #e2e6ea;
        border-radius: 12px;
        padding: 22px;
        margin-bottom: 18px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      }

      .form-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 18px;
      }

      .form-group label {
        display: block;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 700;
        color: #4b5563;
      }

      input,
      select {
        width: 100%;
        height: 42px;
        padding: 0 12px;
        background: white;
        border: 1px solid #cfd6dd;
        border-radius: 7px;
        font-size: 14px;
        color: #222;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: #368463;
        box-shadow: 0 0 0 3px rgba(54, 132, 99, 0.09);
      }

      .template-description {
        margin-top: 15px;
        padding: 12px 14px;
        border-left: 3px solid #40916c;
        background: #f7fbf9;
        color: #5d6873;
        font-size: 13px;
        line-height: 1.65;
      }

      /* 버튼 영역 */
      .button-area {
        margin-top: 19px;
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }

      button {
        height: 39px;
        padding: 0 15px;
        border-radius: 7px;
        border: 1px solid #cfd6dd;
        background: white;
        color: #374151;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s;
      }

      button:hover {
        background: #f7f8fa;
      }

      .btn-primary {
        color: white;
        border-color: #33775b;
        background: #33775b;
      }

      .btn-primary:hover {
        background: #276749;
      }

      .btn-example {
        color: #276749;
        background: #edf7f2;
        border-color: #b8ddcb;
      }

      .btn-example:hover {
        background: #def0e7;
      }

      .btn-danger-lite {
        color: #7a4040;
      }

      /* 편집기 카드 */
      .editor-card {
        background: white;
        border: 1px solid #e2e6ea;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      }

      .editor-card-header {
        padding: 15px 20px;
        background: #fafbfc;
        border-bottom: 1px solid #e8ebee;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .editor-card-title {
        font-size: 14px;
        font-weight: 700;
      }

      .editor-help {
        font-size: 12px;
        color: #8a929c;
      }

      /* 하단 */
      .bottom-actions {
        margin-top: 18px;
        display: flex;
        justify-content: flex-end;
        gap: 9px;
      }

      /* 모달 */
      .modal-overlay {
        display: none;
        position: fixed;
        z-index: 99999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(20, 25, 30, 0.6);
        padding: 35px 20px;
        overflow-y: auto;
      }

      .modal {
        width: min(950px, 100%);
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }

      .modal-header {
        padding: 17px 22px;
        border-bottom: 1px solid #e3e6e9;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-header strong {
        font-size: 16px;
      }

      .modal-close {
        border: none;
        background: transparent;
        font-size: 23px;
        height: auto;
        padding: 0;
      }

      .preview-content {
        padding: 35px 45px 60px;
        line-height: 1.8;
        font-size: 15px;
      }

      .preview-content h1 {
        padding-bottom: 13px;
        border-bottom: 2px solid #333;
        margin-top: 0;
      }

      .preview-content h2 {
        margin-top: 38px;
        padding-bottom: 7px;
        border-bottom: 1px solid #ddd;
      }

      .preview-content h3 {
        margin-top: 25px;
      }

      .preview-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 18px 0;
      }

      .preview-content th,
      .preview-content td {
        border: 1px solid #cfd4d9;
        padding: 9px;
      }

      .preview-content th {
        background: #f3f5f6;
      }

      .guide-box {
        background: #f4f6f8;
        color: #77808a;
        border: 1px dashed #bec5cc;
        padding: 11px 13px;
        border-radius: 5px;
      }

      @media (max-width: 700px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .preview-content {
          padding: 25px 20px 45px;
        }

        .top-header-inner {
          align-items: flex-start;
        }
      }
    </style>
  </head>

  <body>
    <header class="top-header">
      <div class="top-header-inner">
        <div class="brand">
          <div class="brand-logo">A</div>

          <div>
            <div class="brand-title">Acupedia</div>
            <div class="brand-subtitle">Wiki Editor Prototype</div>
          </div>
        </div>

        <div class="demo-badge">DEMO</div>
      </div>
    </header>

    <main class="container">
      <div class="page-heading">
        <h1>Acupedia 위키 작성</h1>

        <p>
          문서 유형별 표준 양식을 제공하여 Acupedia 위키의 구성과 작성 방식을
          통일하기 위한 편집기 예시입니다.
        </p>
      </div>

      <!-- 문서 설정 -->
      <section class="control-panel">
        <div class="form-grid">
          <div class="form-group">
            <label for="wikiTitle">문서 제목</label>

            <input
              id="wikiTitle"
              type="text"
              value="팔맥교회혈"
              placeholder="위키 제목을 입력하세요."
            />
          </div>

          <div class="form-group">
            <label for="templateType">문서 유형</label>

            <select id="templateType" onchange="updateDescription()">
              <option value="acupointTheory">경락·경혈 이론형</option>

              <option value="meridian">경맥형</option>

              <option value="acupoint">개별 경혈형</option>

              <option value="meridianTheory">경락 이론형</option>

              <option value="technique">침구법·치료기술형</option>

              <option value="combination">배혈·처방형</option>
            </select>
          </div>
        </div>

        <div id="templateDescription" class="template-description"></div>

        <div class="button-area">
          <button class="btn-primary" onclick="loadSelectedTemplate()">
            표준 양식 불러오기
          </button>

          <button class="btn-example" onclick="loadExample()">
            팔맥교회혈 모범예시
          </button>

          <button class="btn-danger-lite" onclick="clearEditor()">
            빈 문서
          </button>
        </div>
      </section>

      <!-- TinyMCE -->
      <section class="editor-card">
        <div class="editor-card-header">
          <div class="editor-card-title">위키 본문</div>

          <div class="editor-help">
            표준 목차와 작성 가이드를 참고하여 내용을 작성합니다.
          </div>
        </div>

        <textarea id="editor"></textarea>
      </section>

      <div class="bottom-actions">
        <button onclick="showPreview()">미리보기</button>

        <button class="btn-primary" onclick="demoSave()">저장</button>
      </div>
    </main>

    <!-- 미리보기 모달 -->
    <div
      id="previewOverlay"
      class="modal-overlay"
      onclick="overlayClick(event)"
    >
      <div class="modal">
        <div class="modal-header">
          <strong>위키 미리보기</strong>

          <button class="modal-close" onclick="closePreview()">×</button>
        </div>

        <div id="previewContent" class="preview-content"></div>
      </div>
    </div>

    <script>
      /* =====================================================
     문서 유형 정보
  ===================================================== */

      const templateDescriptions = {
        acupointTheory:
          '오수혈, 원혈, 락혈, 극혈, 팔맥교회혈 등 경혈의 분류와 ' +
          '이론적 체계를 설명하는 문서에 사용하는 양식입니다.',

        meridian:
          '수태음폐경, 족양명위경, 독맥, 임맥 등 하나의 경맥을 ' +
          '종합적으로 설명하는 문서에 사용하는 양식입니다.',

        acupoint:
          '합곡, 후계, 족삼리 등 하나의 경혈을 대상으로 역사, ' +

        meridianTheory:
          '십이경별, 십이경근, 십오락맥, 근결, 표본 등 ' +
          '경락 관련 이론을 설명하는 문서에 사용하는 양식입니다.',

        technique:
          '도침, 전침, 온침, 사혈, 자락법 등 침구 치료기술을 ' +
          '설명하는 문서에 사용하는 양식입니다.',

        combination:
          '원락배혈, 사관혈, 후계-신맥 등 경혈의 조합과 ' +
          '배혈 이론을 설명하는 문서에 사용하는 양식입니다.',
      };

      /* =====================================================
     작성 가이드 박스
  ===================================================== */

      function guide(text) {
        return `
      <div class="guide-box">
        <strong>작성 가이드</strong><br>
        ${text}
      </div>
      <p><br></p>
    `;
      }

      /* =====================================================
     표준 템플릿
  ===================================================== */

      const templates = {
        /* 1. 경락·경혈 이론형 */

        acupointTheory: `

      <h2>1. 개요</h2>

      ${guide(`
        해당 개념이 무엇인지 처음 접하는 독자도 이해할 수 있도록
        핵심 정의와 중요성을 2~4문장으로 설명합니다.
        "본 보고서에서는", "알아보고자 한다" 등의
        보고서식 표현은 사용하지 않습니다.
      `)}


      <h2>2. 명칭과 정의</h2>

      <h3>2.1 명칭</h3>

      ${guide(`
        한자명, 이명, 영어명 등 명칭과 관련된 정보를 기술합니다.
      `)}

      <h3>2.2 정의</h3>

      ${guide(`
        개념의 정확한 정의와 유사 개념과의 차이를 설명합니다.
      `)}


      <h2>3. 역사</h2>

      <h3>3.1 기원</h3>

      ${guide(`
        해당 개념이 등장하는 초기 문헌 및 역사적 배경을 정리합니다.
      `)}

      <h3>3.2 후대의 발전</h3>

      ${guide(`
        시대별로 개념이 어떻게 변화하거나 체계화되었는지 설명합니다.
      `)}


      <h2>4. 구성</h2>

      ${guide(`
        해당 체계를 구성하는 경혈이나 요소를 설명합니다.
        비교가 필요한 경우 표를 적극적으로 사용합니다.
      `)}


      <h2>5. 이론적 의미</h2>

      ${guide(`
        다른 경락·경혈 이론과 어떤 관계가 있는지 설명합니다.
      `)}


      <h2>6. 고전문헌</h2>

      ${guide(`
        관련 고전 기록을 단순 나열하지 말고
        원문 → 번역 → 설명 → 해당 기록의 의의 순으로 정리합니다.
      `)}


      <h2>7. 임상적 활용</h2>

      ${guide(`
        전통적인 활용과 현대 임상에서의 활용을 구분하여 설명합니다.
      `)}


      <h2>8. 현대 연구</h2>

      ${guide(`
        특정 논문 한 편의 연구목적·방법·결과를 순서대로
        요약하지 않습니다. 여러 연구를 주제별로 종합하여
        현재까지 알려진 내용과 한계를 기술합니다.
      `)}


      <h2>9. 논쟁 및 해석상의 차이</h2>

      ${guide(`
        문헌, 시대 또는 학설에 따라 견해가 다른 사항을 정리합니다.
      `)}


      <h2>10. 관련 문서</h2>

      ${guide(`
        Acupedia 내에서 함께 읽을 가치가 있는 관련 위키를 연결합니다.
      `)}


      <h2>11. 참고문헌</h2>

      <h3>11.1 고전문헌</h3>
      <p><br></p>

      <h3>11.2 현대 단행본</h3>
      <p><br></p>

      <h3>11.3 학술논문</h3>
      <p><br></p>

    `,

        /* 2. 경맥형 */

        meridian: `

      <h2>1. 개요</h2>
      ${guide('해당 경맥의 기본 정의와 경락체계에서의 위치를 설명합니다.')}

      <h2>2. 명칭</h2>
      ${guide('한자명, 약칭, 영문명 및 명칭과 관련된 정보를 기술합니다.')}

      <h2>3. 역사</h2>
      ${guide('고전문헌을 중심으로 해당 경맥 개념의 성립과 변화를 설명합니다.')}

      <h2>4. 유주</h2>
      ${guide('경맥의 유주를 본문과 필요시 그림을 이용하여 설명합니다.')}

      <h2>5. 소속 경혈</h2>
      ${guide('해당 경맥에 속하는 경혈을 정리합니다.')}

      <h2>6. 장부와의 관계</h2>
      ${guide('소속 장부 및 관련 장부와의 관계를 기술합니다.')}

      <h2>7. 다른 경맥과의 연결</h2>
      ${guide('표리경 및 다른 경맥과의 연결관계를 설명합니다.')}

      <h2>8. 경별</h2>
      <p><br></p>

      <h2>9. 락맥</h2>
      <p><br></p>

      <h2>10. 경근</h2>
      <p><br></p>

      <h2>11. 고전문헌</h2>
      <p><br></p>

      <h2>12. 병후 및 주치</h2>
      <p><br></p>

      <h2>13. 현대적 해석</h2>
      <p><br></p>

      <h2>14. 관련 문서</h2>
      <p><br></p>

      <h2>15. 참고문헌</h2>
      <p><br></p>

    `,

        /* 3. 개별 경혈형 */

        acupoint: `

      <h2>1. 개요</h2>
      ${guide('해당 경혈의 소속 경맥, 주요 분류 및 특징을 간략하게 설명합니다.')}

      <h2>2. 명칭</h2>

      <h3>2.1 혈명의 의미</h3>
      <p><br></p>

      <h3>2.2 이명</h3>
      <p><br></p>

      <h2>3. 소속과 분류</h2>
      <p><br></p>

      <h2>4. 위치</h2>

      <h3>4.1 고전의 위치</h3>
      <p><br></p>

      <h3>4.2 현대 표준 위치</h3>
      <p><br></p>

      <h3>4.3 해부학적 위치</h3>
      <p><br></p>

      <h2>5. 취혈</h2>
      <p><br></p>

      <h2>6. 혈성 및 주치</h2>

      <h3>6.1 고전 기록</h3>
      <p><br></p>

      <h3>6.2 현대 침구학</h3>
      <p><br></p>

      <h2>7. 배혈</h2>
      <p><br></p>

      <h2>8. 고전문헌</h2>
      <p><br></p>

      <h2>9. 역사적 변화</h2>
      <p><br></p>

      <h2>10. 현대 연구</h2>
      ${guide('특정 논문 하나를 요약하는 대신 연구 분야별 결과를 종합합니다.')}

      <h2>11. 관련 문서</h2>
      <p><br></p>

      <h2>12. 참고문헌</h2>
      <p><br></p>

    `,

        /* 4. 경락 이론형 */

        meridianTheory: `

      <h2>1. 개요</h2>
      <p><br></p>

      <h2>2. 개념과 명칭</h2>
      <p><br></p>

      <h2>3. 역사</h2>
      <p><br></p>

      <h2>4. 기본 구조</h2>
      <p><br></p>

      <h2>5. 구성</h2>
      <p><br></p>

      <h2>6. 십이경맥과의 관계</h2>
      <p><br></p>

      <h2>7. 장부와의 관계</h2>
      <p><br></p>

      <h2>8. 관련 이론</h2>
      <p><br></p>

      <h2>9. 고전문헌</h2>
      <p><br></p>

      <h2>10. 후대의 해석</h2>
      <p><br></p>
