<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Acupedia Wiki Editor Demo</title>

    <!-- TinyMCE -->
    <script src="https://cdn.jsdelivr.net/npm/tinymce@7/tinymce.min.js"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f7fa;
        color: #252a31;
        font-family:
          Pretendard,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'Noto Sans KR',
          Arial,
          sans-serif;
      }

      /* 상단 헤더 */
      .top-header {
        background: white;
        border-bottom: 1px solid #e5e8ec;
      }

      .top-header-inner {
        max-width: 1280px;
        margin: 0 auto;
        padding: 22px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .brand-logo {
        width: 42px;
        height: 42px;
        border-radius: 10px;
        background: #276749;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 22px;
        font-weight: 700;
      }

      .brand-title {
        font-size: 21px;
        font-weight: 700;
        color: #1e2933;
      }

      .brand-subtitle {
        margin-top: 2px;
        font-size: 13px;
        color: #7b8490;
      }

      .demo-badge {
        padding: 7px 12px;
        background: #edf7f2;
        color: #276749;
        border-radius: 30px;
        font-size: 13px;
        font-weight: 600;
      }

      .header-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .nav-link {
        display: inline-flex;
        align-items: center;
        height: 36px;
        padding: 0 14px;
        border: 1px solid #cfd6dd;
        border-radius: 7px;
        background: white;
        color: #374151;
        text-decoration: none;
        font-size: 13px;
        font-weight: 600;
      }

      .nav-link:hover {
        background: #f7f8fa;
      }

      /* 전체 컨테이너 */
      .container {
        max-width: 1280px;
        margin: 30px auto 70px;
        padding: 0 24px;
      }

      .page-heading {
        margin-bottom: 22px;
      }

      .page-heading h1 {
        margin: 0 0 8px;
        font-size: 27px;
        letter-spacing: -0.5px;
      }

      .page-heading p {
        margin: 0;
        color: #68727e;
        line-height: 1.7;
        font-size: 14px;
      }

      /* 설정 패널 */
      .control-panel {
        background: white;
        border: 1px solid #e2e6ea;
        border-radius: 12px;
        padding: 22px;
        margin-bottom: 18px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      }

      .form-grid {
        display: grid;
        grid-template-columns: 2fr 1fr auto;
        gap: 18px;
        align-items: end;
      }

      .form-group label {
        display: block;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 700;
        color: #4b5563;
      }

      .form-group-action {
        display: flex;
        align-items: flex-end;
      }

      .form-group-action .btn-primary {
        height: 42px;
        white-space: nowrap;
      }

      input,
      select {
        width: 100%;
        height: 42px;
        padding: 0 12px;
        background: white;
        border: 1px solid #cfd6dd;
        border-radius: 7px;
        font-size: 14px;
        color: #222;
        outline: none;
      }

      input:focus,
      select:focus {
        border-color: #368463;
        box-shadow: 0 0 0 3px rgba(54, 132, 99, 0.09);
      }

      .template-description {
        margin-top: 15px;
        padding: 12px 14px;
        border-left: 3px solid #40916c;
        background: #f7fbf9;
        color: #5d6873;
        font-size: 13px;
        line-height: 1.65;
      }

      /* 버튼 영역 */
      .button-area {
        margin-top: 19px;
        display: flex;
        flex-wrap: wrap;
        gap: 9px;
      }

      button {
        height: 39px;
        padding: 0 15px;
        border-radius: 7px;
        border: 1px solid #cfd6dd;
        background: white;
        color: #374151;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.15s;
      }

      button:hover {
        background: #f7f8fa;
      }

      .btn-primary {
        color: white;
        border-color: #33775b;
        background: #33775b;
      }

      .btn-primary:hover {
        background: #276749;
      }

      .btn-example {
        color: #276749;
        background: #edf7f2;
        border-color: #b8ddcb;
      }

      .btn-example:hover {
        background: #def0e7;
      }

      .btn-danger-lite {
        color: #7a4040;
      }

      /* 편집기 카드 */
      .editor-card {
        background: white;
        border: 1px solid #e2e6ea;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
      }

      .editor-card-header {
        padding: 15px 20px;
        background: #fafbfc;
        border-bottom: 1px solid #e8ebee;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
      }

      .editor-card-title {
        font-size: 14px;
        font-weight: 700;
        flex-shrink: 0;
        padding-top: 2px;
      }

      .editor-help-group {
        text-align: right;
      }

      .editor-help {
        font-size: 12px;
        color: #8a929c;
        line-height: 1.6;
      }

      .editor-help + .editor-help {
        margin-top: 4px;
      }

      /* 하단 */
      .bottom-actions {
        margin-top: 18px;
        display: flex;
        justify-content: flex-end;
        gap: 9px;
      }

      /* 모달 */
      .modal-overlay {
        display: none;
        position: fixed;
        z-index: 99999;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(20, 25, 30, 0.6);
        padding: 35px 20px;
        overflow-y: auto;
      }

      .modal {
        width: min(950px, 100%);
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
      }

      .modal-header {
        padding: 17px 22px;
        border-bottom: 1px solid #e3e6e9;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .modal-header strong {
        font-size: 16px;
      }

      .modal-close {
        border: none;
        background: transparent;
        font-size: 23px;
        height: auto;
        padding: 0;
      }

      .preview-content {
        padding: 35px 45px 60px;
        line-height: 1.8;
        font-size: 15px;
      }

      .preview-content h1 {
        padding-bottom: 13px;
        border-bottom: 2px solid #333;
        margin-top: 0;
      }

      .preview-content h2 {
        margin-top: 38px;
        padding-bottom: 7px;
        border-bottom: 1px solid #ddd;
      }

      .preview-content h3 {
        margin-top: 25px;
      }

      .preview-content table {
        width: 100%;
        border-collapse: collapse;
        margin: 18px 0;
      }

      .preview-content th,
      .preview-content td {
        border: 1px solid #cfd4d9;
        padding: 9px;
      }

      .preview-content th {
        background: #f3f5f6;
      }

      .guide-box {
        background: #f4f6f8;
        color: #77808a;
        border: 1px dashed #bec5cc;
        padding: 11px 13px;
        border-radius: 5px;
      }

      /* 미리보기용 목차 스타일 */
      .preview-content .acupedia-toc {
        display: inline-block;
        min-width: 260px;
        max-width: 420px;
        margin: 18px 0 28px;
        border: 1px solid #c8ccd1;
        background: #ffffff;
        font-size: 14px;
      }

      .preview-content .acupedia-toc-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 14px;
        font-weight: 700;
        border-bottom: 1px solid #e2e4e7;
        background: #fafafa;
      }

      .preview-content .acupedia-toc-toggle {
        font-size: 12px;
        font-weight: 500;
        color: #555;
        cursor: pointer;
      }

      .preview-content .acupedia-toc-list {
        padding: 10px 14px 12px;
      }

      .preview-content .toc-item {
        line-height: 1.8;
      }

      .preview-content .toc-level-1 {
        padding-left: 0;
      }

      .preview-content .toc-level-2 {
        padding-left: 20px;
      }

      .preview-content .acupedia-toc a {
        color: #1769aa;
        text-decoration: none;
      }

      .preview-content .acupedia-toc a:hover {
        text-decoration: underline;
      }

      @media (max-width: 700px) {
        .form-grid {
          grid-template-columns: 1fr;
        }

        .preview-content {
          padding: 25px 20px 45px;
        }

        .top-header-inner {
          align-items: flex-start;
        }
      }
    </style>
  </head>

  <body>
    <header class="top-header">
      <div class="top-header-inner">
        <div class="brand">
          <div class="brand-logo">A</div>

          <div>
            <div class="brand-title">Acupedia</div>
            <div class="brand-subtitle">Wiki Editor Prototype</div>
          </div>
        </div>

        <div class="header-actions">
          <a class="nav-link" href="./section-edit-demo.html"
            >문단 편집 · 위키링크 데모</a
          >
          <div class="demo-badge">DEMO</div>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="page-heading">
        <h1>Acupedia 위키 작성</h1>

        <p>
          문서 유형별 표준 양식을 제공하여 Acupedia 위키의 구성과 작성 방식을
          통일하기 위한 편집기 예시입니다.
        </p>
      </div>

      <!-- 문서 설정 -->
      <section class="control-panel">
        <div class="form-grid">
          <div class="form-group">
            <label for="wikiTitle">문서 제목</label>

            <input
              id="wikiTitle"
              type="text"
              value=""
              placeholder="위키 제목을 입력하세요."
            />
          </div>

          <div class="form-group">
            <label for="templateType">문서 유형</label>

            <select id="templateType" onchange="updateDescription()">
              <option value="acupointTheory">경락·경혈 이론형</option>

              <option value="meridian">경맥형</option>

              <option value="acupoint">개별 경혈형</option>

              <option value="meridianTheory">경락 이론형</option>

              <option value="technique">침구법·치료기술형</option>

              <option value="combination">배혈·처방형</option>

              <option value="disease">질환형</option>
            </select>
          </div>

          <div class="form-group-action">
            <button class="btn-primary" onclick="loadSelectedTemplate()">
              표준 양식 불러오기
            </button>
          </div>
        </div>

        <div id="templateDescription" class="template-description"></div>

        <div class="button-area">
          <button class="btn-example" onclick="loadExample()">
            예시로 작성해본 팔맥교회혈 모범예시
          </button>

          <button
            class="btn-danger-lite"
            onclick="clearEditor()"
            hidden
            aria-hidden="true"
          >
            빈 문서
          </button>
        </div>
      </section>

      <!-- TinyMCE -->
      <section class="editor-card">
        <div class="editor-card-header">
          <div class="editor-card-title">위키 본문</div>

          <div class="editor-help-group">
            <div class="editor-help">
              제목은 번호 없이 작성하세요. 「목차 생성/갱신」 시 번호와 목차가
              자동으로 붙습니다.
            </div>
            <div class="editor-help">
              미리 설정된 위키 본문의 모든 항목을 채우실 필요는 없으나 최소
              「개요」 항목은 꼭 작성해주시기 바랍니다.
            </div>
          </div>
        </div>

        <textarea id="editor"></textarea>
      </section>

      <div class="bottom-actions">
        <button onclick="showPreview()">미리보기</button>

        <button class="btn-primary" onclick="demoSave()">저장</button>
      </div>
    </main>

    <!-- 미리보기 모달 -->
    <div
      id="previewOverlay"
      class="modal-overlay"
      onclick="overlayClick(event)"
    >
      <div class="modal">
        <div class="modal-header">
          <strong>위키 미리보기</strong>

          <button class="modal-close" onclick="closePreview()">×</button>
        </div>

        <div id="previewContent" class="preview-content"></div>
      </div>
    </div>

    <script>
      /* =====================================================
     문서 유형 정보
  ===================================================== */

      const templateDescriptions = {
        acupointTheory:
          '오수혈, 원혈, 락혈, 극혈, 팔맥교회혈 등 경혈의 분류와 ' +
          '이론적 체계를 설명하는 문서에 사용하는 양식입니다.',

        meridian:
          '수태음폐경, 족양명위경, 독맥, 임맥 등 하나의 경맥을 ' +
          '종합적으로 설명하는 문서에 사용하는 양식입니다.',

        acupoint:
          '합곡, 후계, 족삼리 등 하나의 경혈을 대상으로 역사, ' +
          '위치, 주치, 배혈, 현대 연구 등을 정리하는 양식입니다.',

        meridianTheory:
          '십이경별, 십이경근, 십오락맥, 근결, 표본 등 ' +
          '경락 관련 이론을 설명하는 문서에 사용하는 양식입니다.',

        technique:
          '도침, 전침, 온침, 사혈, 자락법 등 침구 치료기술을 ' +
          '설명하는 문서에 사용하는 양식입니다.',

        combination:
          '원락배혈, 사관혈, 후계-신맥 등 경혈의 조합과 ' +
          '배혈 이론을 설명하는 문서에 사용하는 양식입니다.',

        disease:
          '요통, 편두통, 안면마비, 불임 등 한 질환을 대상으로 ' +
          '개념, 변증, 침구 치료, 고전문헌, 현대 연구 등을 ' +
          '정리하는 문서에 사용하는 양식입니다.',
      };

      /* =====================================================
     작성 가이드 박스
  ===================================================== */

      function guide(text) {
        return `
      <div class="guide-box">
        <strong>작성 가이드</strong><br>
        ${text}
      </div>
      <p><br></p>
    `;
      }

      /* =====================================================
     표준 템플릿
  ===================================================== */

      const templates = {
        /* 1. 경락·경혈 이론형 */

        acupointTheory: `

      <h2>개요</h2>

      ${guide(`
        해당 개념이 무엇인지 처음 접하는 독자도 이해할 수 있도록
        핵심 정의와 중요성을 2~4문장으로 설명합니다.
        "본 보고서에서는", "알아보고자 한다" 등의
        보고서식 표현은 사용하지 않습니다.
      `)}


      <h2>명칭과 정의</h2>

      <h3>명칭</h3>

      ${guide(`
        한자명, 이명, 영어명 등 명칭과 관련된 정보를 기술합니다.
      `)}

      <h3>정의</h3>

      ${guide(`
        개념의 정확한 정의와 유사 개념과의 차이를 설명합니다.
      `)}


      <h2>역사</h2>

      <h3>기원</h3>

      ${guide(`
        해당 개념이 등장하는 초기 문헌 및 역사적 배경을 정리합니다.
      `)}

      <h3>후대의 발전</h3>

      ${guide(`
        시대별로 개념이 어떻게 변화하거나 체계화되었는지 설명합니다.
      `)}


      <h2>구성</h2>

      ${guide(`
        해당 체계를 구성하는 경혈이나 요소를 설명합니다.
        비교가 필요한 경우 표를 적극적으로 사용합니다.
      `)}


      <h2>이론적 의미</h2>

      ${guide(`
        다른 경락·경혈 이론과 어떤 관계가 있는지 설명합니다.
      `)}


      <h2>고전문헌</h2>

      ${guide(`
        관련 고전 기록을 단순 나열하지 말고
        원문 → 번역 → 설명 → 해당 기록의 의의 순으로 정리합니다.
      `)}


      <h2>임상적 활용</h2>

      ${guide(`
        전통적인 활용과 현대 임상에서의 활용을 구분하여 설명합니다.
      `)}


      <h2>현대 연구</h2>

      ${guide(`
        특정 논문 한 편의 연구목적·방법·결과를 순서대로
        요약하지 않습니다. 여러 연구를 주제별로 종합하여
        현재까지 알려진 내용과 한계를 기술합니다.
      `)}


      <h2>논쟁 및 해석상의 차이</h2>

      ${guide(`
        문헌, 시대 또는 학설에 따라 견해가 다른 사항을 정리합니다.
      `)}


      <h2>관련 문서</h2>

      ${guide(`
        Acupedia 내에서 함께 읽을 가치가 있는 관련 위키를 연결합니다.
      `)}


      <h2>참고문헌</h2>

      <h3>고전문헌</h3>
      <p><br></p>

      <h3>현대 단행본</h3>
      <p><br></p>

      <h3>학술논문</h3>
      <p><br></p>

    `,

        /* 2. 경맥형 */

        meridian: `

      <h2>개요</h2>
      ${guide('해당 경맥의 기본 정의와 경락체계에서의 위치를 설명합니다.')}

      <h2>명칭</h2>
      ${guide('한자명, 약칭, 영문명 및 명칭과 관련된 정보를 기술합니다.')}

      <h2>역사</h2>
      ${guide('고전문헌을 중심으로 해당 경맥 개념의 성립과 변화를 설명합니다.')}

      <h2>유주</h2>
      ${guide('경맥의 유주를 본문과 필요시 그림을 이용하여 설명합니다.')}

      <h2>소속 경혈</h2>
      ${guide('해당 경맥에 속하는 경혈을 정리합니다.')}

      <h2>장부와의 관계</h2>
      ${guide('소속 장부 및 관련 장부와의 관계를 기술합니다.')}

      <h2>다른 경맥과의 연결</h2>
      ${guide('표리경 및 다른 경맥과의 연결관계를 설명합니다.')}

      <h2>경별</h2>
      <p><br></p>

      <h2>락맥</h2>
      <p><br></p>

      <h2>경근</h2>
      <p><br></p>

      <h2>고전문헌</h2>
      <p><br></p>

      <h2>병후 및 주치</h2>
      <p><br></p>

      <h2>현대적 해석</h2>
      <p><br></p>

            h2Count += 1;
            h3Count = 0;
            heading.textContent = h2Count + '. ' + title;
            return;
          }

          if (tag === 'h3') {
            h3Count += 1;
            const major = h2Count > 0 ? h2Count : 0;
            heading.textContent = major + '.' + h3Count + ' ' + title;
          }
        });
      }

      /* =====================================================
     목차 자동 생성
  ===================================================== */

      function generateTableOfContents(editor) {
        const body = editor.getBody();

        /* 기존 목차가 있으면 제거 */
        const oldToc = body.querySelector('.acupedia-toc');

        if (oldToc) {
          oldToc.remove();
        }

        /*
          문서 내 H2, H3를 목차 대상으로 사용
          H1은 문서 제목이므로 제외
        */
        const headings = Array.from(body.querySelectorAll('h2, h3'));

        if (headings.length === 0) {
          editor.notificationManager.open({
            text: '목차로 만들 제목이 없습니다.',
            type: 'info',
          });

          return;
        }

        /* 제목 번호 재계산 후 부여 */
        applyHeadingNumbers(headings);

        /* 각 제목에 고유 id 부여 (순서 기준 재할당) */
        headings.forEach((heading, index) => {
          heading.id = 'wiki-section-' + (index + 1);
        });

        /* 목차 영역 생성 */
        const toc = document.createElement('div');

        toc.className = 'acupedia-toc';
        toc.setAttribute('contenteditable', 'false');

        const tocHeader = document.createElement('div');

        tocHeader.className = 'acupedia-toc-header';

        tocHeader.innerHTML = `
          <span>목차</span>
          <span class="acupedia-toc-toggle">접기</span>
        `;

        toc.appendChild(tocHeader);

        const tocList = document.createElement('div');

        tocList.className = 'acupedia-toc-list';

        headings.forEach((heading) => {
          const item = document.createElement('div');

          const level =
            heading.tagName.toLowerCase() === 'h3'
              ? 'toc-level-2'
              : 'toc-level-1';

          item.className = 'toc-item ' + level;

          const link = document.createElement('a');

          link.href = '#' + heading.id;
          link.textContent = heading.textContent;

          /*
            TinyMCE 편집 화면에서도
            클릭 시 바로 이동하도록 처리
          */
          link.addEventListener('click', function (event) {
            event.preventDefault();

            const target = editor.getBody().querySelector('#' + heading.id);

            if (target) {
              target.scrollIntoView({
                behavior: 'smooth',
                block: 'start',
              });
            }
          });

          item.appendChild(link);
          tocList.appendChild(item);
        });

        toc.appendChild(tocList);

        /* 첫 번째 H2/H3 앞에 삽입 */
        headings[0].parentNode.insertBefore(toc, headings[0]);

        /* 접기/펼치기 */
        const toggle = toc.querySelector('.acupedia-toc-toggle');

        toggle.addEventListener('click', function () {
          const isHidden = tocList.style.display === 'none';

          tocList.style.display = isHidden ? 'block' : 'none';
          toggle.textContent = isHidden ? '접기' : '펼치기';
        });
      }

      /* =====================================================
     설명 업데이트
  ===================================================== */

      function updateDescription() {
        const type = document.getElementById('templateType').value;

        document.getElementById('templateDescription').innerText =
          templateDescriptions[type];
      }

      /* =====================================================
     내용 변경 전 확인
  ===================================================== */

      function confirmReplace(message) {
        const editor = tinymce.get('editor');

        if (!editor) {
          return false;
        }

        const current = editor.getContent({ format: 'text' }).trim();

        if (!current) {
          return true;
        }

        return confirm(message + '\n\n현재 편집 중인 내용은 삭제됩니다.');
      }

      /* =====================================================
     표준 양식
  ===================================================== */

      function loadSelectedTemplate() {
        const type = document.getElementById('templateType').value;

        if (
          !confirmReplace('선택한 문서 유형의 표준 양식을 불러오시겠습니까?')
        ) {
          return;
        }

        tinymce.get('editor').setContent(templates[type]);
        generateTableOfContents(tinymce.get('editor'));
      }

      /* =====================================================
     모범예시
  ===================================================== */

      function loadExample() {
        if (!confirmReplace('팔맥교회혈 모범예시를 불러오시겠습니까?')) {
          return;
        }

        document.getElementById('wikiTitle').value = '팔맥교회혈';

        document.getElementById('templateType').value = 'acupointTheory';

        updateDescription();

        tinymce.get('editor').setContent(exampleContent);
        generateTableOfContents(tinymce.get('editor'));
      }

      /* =====================================================
     빈 문서
  ===================================================== */

      function clearEditor() {
        if (!confirmReplace('빈 문서로 변경하시겠습니까?')) {
          return;
        }

        tinymce.get('editor').setContent('');
      }

      /* =====================================================
     미리보기
  ===================================================== */

      function showPreview() {
        const editor = tinymce.get('editor');

        const title = document.getElementById('wikiTitle').value.trim();

        const content = editor.getContent();

        document.getElementById('previewContent').innerHTML = `

      ${title ? `<h1>${escapeHtml(title)}</h1>` : ''}

      ${content}

    `;

        document.getElementById('previewOverlay').style.display = 'block';

        setupPreviewLinks();
      }

      function setupPreviewLinks() {
        const preview = document.getElementById('previewContent');

        const links = preview.querySelectorAll('.acupedia-toc a[href^="#"]');

        links.forEach((link) => {
          link.addEventListener('click', function (event) {
            event.preventDefault();

            const id = link.getAttribute('href').substring(1);

            const target = preview.querySelector('#' + CSS.escape(id));

            if (target) {
              target.scrollIntoView({
                behavior: 'smooth',
                block: 'start',
              });
            }
          });
        });

        const toggle = preview.querySelector('.acupedia-toc-toggle');
        const tocList = preview.querySelector('.acupedia-toc-list');

        if (toggle && tocList) {
          toggle.addEventListener('click', function () {
            const isHidden = tocList.style.display === 'none';

            tocList.style.display = isHidden ? 'block' : 'none';
            toggle.textContent = isHidden ? '접기' : '펼치기';
          });
        }
      }

      function closePreview() {
        document.getElementById('previewOverlay').style.display = 'none';
      }

      function overlayClick(event) {
        if (event.target.id === 'previewOverlay') {
          closePreview();
        }
      }

      /* =====================================================
     데모 저장
  ===================================================== */

      function demoSave() {
        alert(
          '현재 페이지는 교수님 설명을 위한 데모입니다.\n\n' +
            '실제 Acupedia 적용 시 서버와 연결하여 저장되도록 구현할 수 있습니다.',
        );
      }

      /* =====================================================
     HTML escape
  ===================================================== */

      function escapeHtml(text) {
        const div = document.createElement('div');

        div.textContent = text;

        return div.innerHTML;
      }

      /* 초기 설명 */

      updateDescription();
    </script>
  </body>
</html>
